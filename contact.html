  <section>
    <h2>Get in Touch</h2>
    <p>We’d love to hear from you! Fill out the form below or just say hello.</p>

    <!-- Contact Form -->
    <form>
      <label for="name">Name:</label><br>
      <input type="text" id="name" name="name" placeholder="Your name"><br><br>

      <label for="email">Email:</label><br>
      <input type="email" id="email" name="email" placeholder="Your email"><br><br>

      <label for="message">Message:</label><br>
      <textarea id="message" name="message" rows="5" cols="40" placeholder="Write your message here..."></textarea><br><br>

      <button type="submit" onclick="alert('Message sent! 🌸')">Send Message</button>
    </form>
  </section>
